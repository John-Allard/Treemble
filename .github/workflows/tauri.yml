name: Build Treemble

on:
  workflow_dispatch:
    inputs:
      build_os:
        description: "Which OS build(s) to run"
        type: choice
        options:
          - both
          - mac
          - windows
        default: both

permissions:
  contents: read
  id-token: write

jobs:
  # —―――――――――――――――――――――――――――――――――――――――――――――――――――――――――
  build-mac:
    name: Build (macOS)
    # Run this job if:
    #   • not a manual trigger (i.e., on push/PR, run by default), or
    #   • build_os is “both,” or
    #   • build_os is “mac”
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_os == 'both' || inputs.build_os == 'mac' }}
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install project dependencies
        run: pnpm install

      - name: Install Tauri CLI (prebuilt)
        run: pnpm add -D @tauri-apps/cli@latest

      - name: Build Treemble (web + bundle)
        run: pnpm run bundle

      - name: Zip macOS .app bundle
        run: |
          cd src-tauri/target/release/bundle/macos
          zip -r Treemble.app.zip Treemble.app

      - name: Upload macOS .dmg
        uses: actions/upload-artifact@v4
        with:
          name: treemble-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload macOS .app.zip
        uses: actions/upload-artifact@v4
        with:
          name: treemble-macos-app
          path: src-tauri/target/release/bundle/macos/Treemble.app.zip

  # —―――――――――――――――――――――――――――――――――――――――――――――――――――――――――
  build-windows:
    name: Build (Windows)
    # Run this job if:
    #   • not a manual trigger, or
    #   • build_os is “both,” or
    #   • build_os is “windows”
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_os == 'both' || inputs.build_os == 'windows' }}
    runs-on: windows-latest
    environment: windows-signing

    env:
      SIGNING_ENDPOINT: https://eus.codesigning.azure.net/
      SIGNING_ACCOUNT: jallardcodesign
      CERTIFICATE_PROFILE: johnallardpublictrust
      TIMESTAMP_URL: http://timestamp.acs.microsoft.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install project dependencies
        run: pnpm install

      - name: Install Tauri CLI (prebuilt)
        run: pnpm add -D @tauri-apps/cli@latest

      - name: Install Windows prerequisites
        run: |
          choco install webview2-runtime
          rustup target add x86_64-pc-windows-msvc

      - name: Build Treemble (web + bundle)
        run: pnpm run bundle

      - name: Azure login with GitHub OIDC
        if: ${{ github.actor == 'John-Allard' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows MSI
        if: ${{ github.actor == 'John-Allard' }}
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\src-tauri\target\release\bundle\msi
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: ${{ env.TIMESTAMP_URL }}
          timestamp-digest: SHA256

      - name: Verify Windows MSI signature
        if: ${{ github.actor == 'John-Allard' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msiFiles = @(
            Get-ChildItem `
              -LiteralPath "$env:GITHUB_WORKSPACE\src-tauri\target\release\bundle\msi" `
              -Recurse `
              -Filter "*.msi"
          )

          if ($msiFiles.Count -eq 0) {
            throw "No MSI files were found to verify."
          }

          foreach ($msi in $msiFiles) {
            $signature = Get-AuthenticodeSignature -LiteralPath $msi.FullName
            $signature | Format-List Path, Status, StatusMessage, SignerCertificate, TimeStamperCertificate
            if ($signature.Status -ne "Valid") {
              throw "Signature verification failed for $($msi.FullName) with status $($signature.Status)."
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: treemble-windows
          path: src-tauri/target/release/bundle/msi/**/*.msi
