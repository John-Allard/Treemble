name: Build Treemble

on:
  workflow_dispatch:
    inputs:
      build_os:
        description: "Which OS build(s) to run"
        type: choice
        options:
          - both
          - mac
          - windows
        default: both

permissions:
  contents: read
  id-token: write

jobs:
  # —―――――――――――――――――――――――――――――――――――――――――――――――――――――――――
  build-mac:
    name: Build (macOS)
    # Run this job if:
    #   • not a manual trigger (i.e., on push/PR, run by default), or
    #   • build_os is “both,” or
    #   • build_os is “mac”
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_os == 'both' || inputs.build_os == 'mac' }}
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install project dependencies
        run: pnpm install

      - name: Install Tauri CLI (prebuilt)
        run: pnpm add -D @tauri-apps/cli@latest

      - name: Install macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build Treemble (web + Universal bundle)
        run: |
          pnpm run build:web
          pnpm tauri build --target universal-apple-darwin --bundles app

      - name: Verify and package Universal macOS app
        run: |
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/Treemble.app"
          EXECUTABLE="$APP_PATH/Contents/MacOS/treemble"
          ARCHITECTURES="$(lipo -archs "$EXECUTABLE")"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          DMG_DIR="src-tauri/target/universal-apple-darwin/release/bundle/dmg"

          echo "Treemble architectures: $ARCHITECTURES"
          [[ "$ARCHITECTURES" == *arm64* ]]
          [[ "$ARCHITECTURES" == *x86_64* ]]

          mkdir -p "$DMG_DIR"
          hdiutil create \
            -volname Treemble \
            -srcfolder "$APP_PATH" \
            -ov \
            -format UDZO \
            "$DMG_DIR/Treemble_${APP_VERSION}_universal-unsigned.dmg"

          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          zip -r Treemble.app.zip Treemble.app

      - name: Upload Universal macOS .dmg
        uses: actions/upload-artifact@v4
        with:
          name: treemble-macos-universal-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload Universal macOS .app.zip
        uses: actions/upload-artifact@v4
        with:
          name: treemble-macos-universal-app
          path: src-tauri/target/universal-apple-darwin/release/bundle/macos/Treemble.app.zip

  # —―――――――――――――――――――――――――――――――――――――――――――――――――――――――――
  build-windows:
    name: Build (Windows)
    # Run this job if:
    #   • not a manual trigger, or
    #   • build_os is “both,” or
    #   • build_os is “windows”
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_os == 'both' || inputs.build_os == 'windows' }}
    runs-on: windows-latest
    environment: windows-signing

    env:
      SIGNING_ENDPOINT: https://eus.codesigning.azure.net/
      SIGNING_ACCOUNT: jallardcodesign
      CERTIFICATE_PROFILE: johnallardpublictrust
      TIMESTAMP_URL: http://timestamp.acs.microsoft.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install project dependencies
        run: pnpm install

      - name: Install Tauri CLI (prebuilt)
        run: pnpm add -D @tauri-apps/cli@latest

      - name: Install Windows prerequisites
        run: |
          choco install webview2-runtime
          rustup target add x86_64-pc-windows-msvc

      - name: Build Treemble executable
        run: |
          pnpm run build:web
          pnpm tauri build --no-bundle

      - name: Azure login with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows executable
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\src-tauri\target\release\treemble.exe
          file-digest: SHA256
          timestamp-rfc3161: ${{ env.TIMESTAMP_URL }}
          timestamp-digest: SHA256

      - name: Verify Windows executable signature
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $executable = "$env:GITHUB_WORKSPACE\src-tauri\target\release\treemble.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $executable
          $signature | Format-List Path, Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($signature.Status -ne "Valid") {
            throw "Executable signature verification failed with status $($signature.Status)."
          }

      - name: Bundle signed Windows executable
        run: pnpm tauri bundle --bundles msi

      - name: Sign Windows MSI
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\src-tauri\target\release\bundle\msi
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: ${{ env.TIMESTAMP_URL }}
          timestamp-digest: SHA256

      - name: Verify Windows MSI signature
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msiFiles = @(
            Get-ChildItem `
              -LiteralPath "$env:GITHUB_WORKSPACE\src-tauri\target\release\bundle\msi" `
              -Recurse `
              -Filter "*.msi"
          )

          if ($msiFiles.Count -eq 0) {
            throw "No MSI files were found to verify."
          }

          foreach ($msi in $msiFiles) {
            $signature = Get-AuthenticodeSignature -LiteralPath $msi.FullName
            $signature | Format-List Path, Status, StatusMessage, SignerCertificate, TimeStamperCertificate
            if ($signature.Status -ne "Valid") {
              throw "Signature verification failed for $($msi.FullName) with status $($signature.Status)."
            }
          }

          # Smart App Control evaluates the installed executable, not only the
          # installer envelope. Extract the MSI and verify the exact binary users run.
          $extractDirectory = Join-Path $env:RUNNER_TEMP "treemble-msi-verification"
          New-Item -ItemType Directory -Path $extractDirectory -Force | Out-Null
          $process = Start-Process msiexec.exe -ArgumentList @(
            "/a",
            "`"$($msiFiles[0].FullName)`"",
            "/qn",
            "TARGETDIR=`"$extractDirectory`""
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "MSI extraction failed with exit code $($process.ExitCode)."
          }

          $installedExecutables = @(Get-ChildItem -LiteralPath $extractDirectory -Recurse -Filter "treemble.exe")
          if ($installedExecutables.Count -ne 1) {
            throw "Expected one installed treemble.exe, found $($installedExecutables.Count)."
          }

          $installedSignature = Get-AuthenticodeSignature -LiteralPath $installedExecutables[0].FullName
          $installedSignature | Format-List Path, Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($installedSignature.Status -ne "Valid") {
            throw "Installed executable signature verification failed with status $($installedSignature.Status)."
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: treemble-windows
          path: src-tauri/target/release/bundle/msi/**/*.msi
